name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    working-directory: src/typesharp-ts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.20.0
        cache: npm
        cache-dependency-path: src/typesharp-ts/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test
